name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=1.23,<2" "scipy>=1.10,<2" "pytest>=7.4,<9" PyYAML
      - name: Compile Python sources
        run: python -m compileall -q src optical_flow tools
      - name: Run metric unit tests
        run: pytest -q tools/bbfr/test_bbfr.py tools/queue_estimation/test_queue.py
